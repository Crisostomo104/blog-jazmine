<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | Jazmine's Journal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="data.js"></script>
    <style>
        .error-message {
            text-align: center;
            margin: 5rem;
            padding: 5rem;
            background: var(--color-surface);
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
        }

        .error-message h1 {
            color: var(--color-primary-dark);
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Jazmine's Journal</a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-item" data-category="Home">Home</a></li>
                <li><a href="index.html#latest" class="nav-item active" data-category="Posts">Posts</a></li>
                <li><a href="contact.html">Contacts</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
            <div class="nav-icons">
                <a href="#" onclick="openSearch()"><i data-feather="search"></i></a>
            </div>
        </div>
    </nav>

    <div id="articleContainer">
        <!-- Rendered by JS -->
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-brand">
                <h3>Jazmine's Journal</h3>
                <p>Curating a beautiful life, one post at a time.</p>
                <div class="social-links">
                    <a href="https://www.facebook.com/Szaura" target="_blank"><i data-feather="facebook"></i></a>
                    <a href="https://www.instagram.com/itz_kxndall" target="_blank"><i data-feather="instagram"></i></a>
                    <a href="mailto:deandresjaz@gmail.com"><i data-feather="mail"></i></a>
                </div>
            </div>
            <div class="footer-links">
                <div class="link-group">
                    <h4>Explore</h4>
                    <a href="about.html">About Me</a>
                    <a href="contact.html">Contact</a>
                    <a href="work.html">Work With Me</a>
                </div>
                <div class="link-group">
                    <h4>Legal</h4>
                    <a href="privacy.html">Privacy Policy</a>
                    <a href="terms.html">Terms of Service</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Jazmine's Journal. All rights reserved.</p>
            <p>Made with ❤️ by <a href="https://loadssss.vercel.app/"
                    style="color: var(--color-primary-dark); text-decoration: underline; " target="_blank">Loadsss</a>
            </p>
        </div>
    </footer>

    <script>
        function renderArticle() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = parseInt(urlParams.get('id'));
            const post = posts.find(p => p.id === id);

            const container = document.getElementById('articleContainer');

            if (post) {
                document.title = post.title + " | Jazmine's Journal";
                container.innerHTML = `
                    <main class="page-container" style="max-width: 800px; margin: 5rem auto; padding: 0 2rem;">
                        <div style="text-align: center; margin-bottom: 3rem;">
                            <span class="post-category" style="display: inline-block; margin-bottom: 1rem; font-size: 0.9rem;">${post.category}</span>
                            <h1 style="font-size: 3rem; color: var(--color-primary-dark); margin-bottom: 1.5rem; line-height: 1.2;">${post.title}</h1>
                            <div style="color: var(--color-text); opacity: 0.8; font-size: 0.95rem; display: flex; justify-content: center; align-items: center; gap: 0.5rem;">
                                <i data-feather="calendar" style="width: 16px; height: 16px;"></i> ${post.date}
                            </div>
                        </div>
                        
                        <img src="${post.image}" alt="${post.title}" style="width: 100%; border-radius: 24px; margin-bottom: 4rem; box-shadow: var(--shadow-md); max-height: 500px; object-fit: cover;">
                        
                        <div style="font-size: 1.1rem; line-height: 1.9; color: var(--color-text);">
                            ${post.content}
                        </div>
                        
                        <div style="margin-top: 5rem; padding-top: 3rem; border-top: 1px solid var(--color-border); text-align: center;">
                            <a href="index.html" class="btn btn-secondary"><i data-feather="arrow-left" style="width: 16px; height: 16px; margin-bottom: -2px; margin-right: 8px;"></i> Back to all posts</a>
                        </div>
                    </main>
                `;
            } else {
                container.innerHTML = `
                    <div class="error-message">
                        <h1>Oops!</h1>
                        <p style="color: var(--color-text); font-size: 1.2rem; margin-bottom: 2rem;">We couldn't find the article you're looking for.</p>
                        <a href="index.html" class="btn btn-primary">Return Home</a>
                    </div>
                `;
            }
            feather.replace();
        }

        renderArticle();

        function openSearch() {
            Swal.fire({
                title: 'Search Articles',
                input: 'text',
                inputPlaceholder: 'Search for skincare, outfits, places...',
                showCancelButton: true,
                confirmButtonText: 'Search',
                confirmButtonColor: '#f472b6',
                cancelButtonColor: '#d33'
            }).then((result) => {
                if (result.isConfirmed && result.value) {
                    window.location.href = 'index.html?search=' + encodeURIComponent(result.value) + '#latest';
                }
            });
        }
    </script>
</body>

</html>
